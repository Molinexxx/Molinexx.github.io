<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="panel" x1="260" y1="180" x2="1340" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14233A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0B1326" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent" x1="340" y1="140" x2="1230" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61DAFB"/>
      <stop offset="1" stop-color="#7E8BFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #F4F7FF; letter-spacing: 1px; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #94A8C9; }
      .classTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #F8FBFF; }
      .classBody { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #D5E3FF; }
      .classMeta { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #7FE4FF; letter-spacing: 1.2px; }
      .relation { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #92E6FF; }
    </style>
  </defs>

  <rect width="1600" height="960" rx="40" fill="url(#bg)"/>
  <circle cx="238" cy="172" r="156" fill="#61DAFB" fill-opacity="0.08"/>
  <circle cx="1360" cy="210" r="190" fill="#7E8BFF" fill-opacity="0.08"/>
  <rect x="70" y="70" width="1460" height="820" rx="34" fill="url(#panel)" stroke="rgba(255,255,255,0.09)"/>

  <text x="120" y="150" class="title">UML · SaaS Barbearia</text>
  <text x="120" y="188" class="subtitle">Modelo conceitual com foco em agendamento, operacao, servicos e pagamentos.</text>

  <g filter="url(#glow)">
    <path d="M515 300H705" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M985 300H1185" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M800 392V468" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M800 640V720" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M610 560H705" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M895 560H990" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="240" y="210" width="275" height="180" rx="22" fill="#101B2E" stroke="#61DAFB" stroke-opacity="0.35"/>
    <text x="270" y="248" class="classMeta">ENTIDADE</text>
    <text x="270" y="286" class="classTitle">Cliente</text>
    <line x1="270" y1="304" x2="485" y2="304" stroke="#223655"/>
    <text x="270" y="334" class="classBody">+ idCliente</text>
    <text x="270" y="360" class="classBody">+ nome</text>
    <text x="270" y="386" class="classBody">+ telefone</text>
  </g>

  <g>
    <rect x="705" y="210" width="280" height="180" rx="22" fill="#101B2E" stroke="#8B8CFF" stroke-opacity="0.36"/>
    <text x="735" y="248" class="classMeta">ENTIDADE CENTRAL</text>
    <text x="735" y="286" class="classTitle">Agendamento</text>
    <line x1="735" y1="304" x2="955" y2="304" stroke="#223655"/>
    <text x="735" y="334" class="classBody">+ idAgendamento</text>
    <text x="735" y="360" class="classBody">+ dataHora</text>
    <text x="735" y="386" class="classBody">+ status</text>
  </g>

  <g>
    <rect x="1185" y="210" width="260" height="180" rx="22" fill="#101B2E" stroke="#61DAFB" stroke-opacity="0.35"/>
    <text x="1215" y="248" class="classMeta">CATALOGO</text>
    <text x="1215" y="286" class="classTitle">Servico</text>
    <line x1="1215" y1="304" x2="1415" y2="304" stroke="#223655"/>
    <text x="1215" y="334" class="classBody">+ idServico</text>
    <text x="1215" y="360" class="classBody">+ nome</text>
    <text x="1215" y="386" class="classBody">+ preco</text>
  </g>

  <g>
    <rect x="705" y="470" width="280" height="170" rx="22" fill="#101B2E" stroke="#61DAFB" stroke-opacity="0.35"/>
    <text x="735" y="508" class="classMeta">OPERACAO</text>
    <text x="735" y="546" class="classTitle">Pagamento</text>
    <line x1="735" y1="564" x2="955" y2="564" stroke="#223655"/>
    <text x="735" y="594" class="classBody">+ idPagamento</text>
    <text x="735" y="620" class="classBody">+ valor</text>
    <text x="735" y="646" class="classBody">+ metodo</text>
  </g>

  <g>
    <rect x="350" y="470" width="260" height="170" rx="22" fill="#101B2E" stroke="#61DAFB" stroke-opacity="0.35"/>
    <text x="380" y="508" class="classMeta">RECURSO</text>
    <text x="380" y="546" class="classTitle">Profissional</text>
    <line x1="380" y1="564" x2="580" y2="564" stroke="#223655"/>
    <text x="380" y="594" class="classBody">+ idProfissional</text>
    <text x="380" y="620" class="classBody">+ nome</text>
    <text x="380" y="646" class="classBody">+ especialidade</text>
  </g>

  <g>
    <rect x="990" y="470" width="270" height="170" rx="22" fill="#101B2E" stroke="#8B8CFF" stroke-opacity="0.36"/>
    <text x="1020" y="508" class="classMeta">CONTROLE</text>
    <text x="1020" y="546" class="classTitle">Agenda</text>
    <line x1="1020" y1="564" x2="1230" y2="564" stroke="#223655"/>
    <text x="1020" y="594" class="classBody">+ disponibilidade</text>
    <text x="1020" y="620" class="classBody">+ horarios</text>
    <text x="1020" y="646" class="classBody">+ bloqueios</text>
  </g>

  <g>
    <rect x="705" y="720" width="280" height="130" rx="22" fill="#101B2E" stroke="#61DAFB" stroke-opacity="0.35"/>
    <text x="735" y="758" class="classMeta">COMUNICACAO</text>
    <text x="735" y="796" class="classTitle">Notificacao</text>
    <line x1="735" y1="814" x2="955" y2="814" stroke="#223655"/>
    <text x="735" y="840" class="classBody">+ mensagem</text>
  </g>

  <text x="566" y="288" class="relation">1 .. *</text>
  <text x="1060" y="288" class="relation">* .. 1</text>
  <text x="818" y="442" class="relation">gera</text>
  <text x="808" y="694" class="relation">envia</text>
  <text x="640" y="548" class="relation">atende</text>
  <text x="925" y="548" class="relation">organiza</text>
</svg>
