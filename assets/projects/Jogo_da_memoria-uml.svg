<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="100" y1="70" x2="1490" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111E"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="panel" x1="250" y1="150" x2="1350" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13233A" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#091223" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="360" y1="150" x2="1240" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70E4FF"/>
      <stop offset="1" stop-color="#8A7FFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #F4F8FF; letter-spacing: 1px; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #96A9C8; }
      .classTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #FAFCFF; }
      .classBody { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #D6E4FF; }
      .classMeta { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #80E7FF; letter-spacing: 1.2px; }
      .relation { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #92E6FF; }
    </style>
  </defs>

  <rect width="1600" height="960" rx="40" fill="url(#bg)"/>
  <circle cx="230" cy="170" r="156" fill="#70E4FF" fill-opacity="0.08"/>
  <circle cx="1362" cy="190" r="184" fill="#8A7FFF" fill-opacity="0.08"/>
  <rect x="70" y="70" width="1460" height="820" rx="34" fill="url(#panel)" stroke="rgba(255,255,255,0.09)"/>

  <text x="120" y="150" class="title">UML · Jogo da Memoria</text>
  <text x="120" y="188" class="subtitle">Modelo conceitual para logica de partida, cartas, jogadas e controle por sessao.</text>

  <g filter="url(#glow)">
    <path d="M480 300H675" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M965 300H1160" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M820 390V470" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M610 560H700" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M940 560H1030" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M820 640V728" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="205" y="210" width="275" height="180" rx="22" fill="#101B2E" stroke="#70E4FF" stroke-opacity="0.36"/>
    <text x="235" y="248" class="classMeta">CONTEXTO</text>
    <text x="235" y="286" class="classTitle">Jogador</text>
    <line x1="235" y1="304" x2="450" y2="304" stroke="#223655"/>
    <text x="235" y="334" class="classBody">+ idSessao</text>
    <text x="235" y="360" class="classBody">+ tentativas</text>
    <text x="235" y="386" class="classBody">+ pontuacao</text>
  </g>

  <g>
    <rect x="675" y="210" width="290" height="180" rx="22" fill="#101B2E" stroke="#8A7FFF" stroke-opacity="0.36"/>
    <text x="705" y="248" class="classMeta">PROCESSO CENTRAL</text>
    <text x="705" y="286" class="classTitle">Partida</text>
    <line x1="705" y1="304" x2="935" y2="304" stroke="#223655"/>
    <text x="705" y="334" class="classBody">+ estado</text>
    <text x="705" y="360" class="classBody">+ paresEncontrados</text>
    <text x="705" y="386" class="classBody">+ reiniciar()</text>
  </g>

  <g>
    <rect x="1160" y="210" width="250" height="180" rx="22" fill="#101B2E" stroke="#70E4FF" stroke-opacity="0.36"/>
    <text x="1190" y="248" class="classMeta">ELEMENTO</text>
    <text x="1190" y="286" class="classTitle">Carta</text>
    <line x1="1190" y1="304" x2="1380" y2="304" stroke="#223655"/>
    <text x="1190" y="334" class="classBody">+ emoji</text>
    <text x="1190" y="360" class="classBody">+ virada</text>
    <text x="1190" y="386" class="classBody">+ encontrada</text>
  </g>

  <g>
    <rect x="700" y="470" width="240" height="170" rx="22" fill="#101B2E" stroke="#70E4FF" stroke-opacity="0.36"/>
    <text x="730" y="508" class="classMeta">ACAO</text>
    <text x="730" y="546" class="classTitle">Jogada</text>
    <line x1="730" y1="564" x2="910" y2="564" stroke="#223655"/>
    <text x="730" y="594" class="classBody">+ primeiraCarta</text>
    <text x="730" y="620" class="classBody">+ segundaCarta</text>
    <text x="730" y="646" class="classBody">+ comparar()</text>
  </g>

  <g>
    <rect x="350" y="470" width="260" height="170" rx="22" fill="#101B2E" stroke="#70E4FF" stroke-opacity="0.36"/>
    <text x="380" y="508" class="classMeta">ESTRUTURA</text>
    <text x="380" y="546" class="classTitle">Tabuleiro</text>
    <line x1="380" y1="564" x2="580" y2="564" stroke="#223655"/>
    <text x="380" y="594" class="classBody">+ grade</text>
    <text x="380" y="620" class="classBody">+ embaralhar()</text>
    <text x="380" y="646" class="classBody">+ renderizar()</text>
  </g>

  <g>
    <rect x="1030" y="470" width="280" height="170" rx="22" fill="#101B2E" stroke="#8A7FFF" stroke-opacity="0.36"/>
    <text x="1060" y="508" class="classMeta">PERSISTENCIA</text>
    <text x="1060" y="546" class="classTitle">SessaoPHP</text>
    <line x1="1060" y1="564" x2="1280" y2="564" stroke="#223655"/>
    <text x="1060" y="594" class="classBody">+ salvarEstado</text>
    <text x="1060" y="620" class="classBody">+ restaurarPartida</text>
    <text x="1060" y="646" class="classBody">+ resetarJogo</text>
  </g>

  <g>
    <rect x="690" y="728" width="270" height="120" rx="22" fill="#101B2E" stroke="#70E4FF" stroke-opacity="0.36"/>
    <text x="720" y="766" class="classMeta">FEEDBACK</text>
    <text x="720" y="804" class="classTitle">Interface</text>
    <line x1="720" y1="822" x2="930" y2="822" stroke="#223655"/>
    <text x="720" y="846" class="classBody">+ mensagens / tentativas</text>
  </g>

  <text x="540" y="288" class="relation">1 .. 1</text>
  <text x="1030" y="288" class="relation">1 .. *</text>
  <text x="832" y="442" class="relation">gera</text>
  <text x="632" y="548" class="relation">exibe</text>
  <text x="958" y="548" class="relation">persiste</text>
  <text x="832" y="700" class="relation">atualiza</text>
</svg>
