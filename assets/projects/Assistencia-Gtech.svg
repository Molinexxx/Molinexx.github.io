<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1480" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111E"/>
      <stop offset="1" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="panel" x1="230" y1="150" x2="1360" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#132238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A1324" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="360" y1="160" x2="1240" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6CE6FF"/>
      <stop offset="1" stop-color="#6F8BFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 54px 'Segoe UI', Arial, sans-serif; fill: #F5F9FF; letter-spacing: 1px; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #97AAC8; }
      .classTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #F9FBFF; }
      .classBody { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #D9E6FF; }
      .classMeta { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #7EE7FF; letter-spacing: 1.2px; }
      .relation { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #94E7FF; }
    </style>
  </defs>

  <rect width="1600" height="960" rx="40" fill="url(#bg)"/>
  <circle cx="250" cy="170" r="160" fill="#6CE6FF" fill-opacity="0.08"/>
  <circle cx="1348" cy="184" r="180" fill="#6F8BFF" fill-opacity="0.08"/>
  <rect x="70" y="70" width="1460" height="820" rx="34" fill="url(#panel)" stroke="rgba(255,255,255,0.09)"/>

  <text x="120" y="150" class="title">UML · Assistencia Gtech</text>
  <text x="120" y="188" class="subtitle">Modelo conceitual para atendimento tecnico, ordens de servico, diagnostico e pecas.</text>

  <g filter="url(#glow)">
    <path d="M500 300H680" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M970 300H1170" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M825 392V472" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M620 560H705" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M945 560H1030" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M825 640V734" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="225" y="210" width="275" height="180" rx="22" fill="#101B2E" stroke="#6CE6FF" stroke-opacity="0.36"/>
    <text x="255" y="248" class="classMeta">ENTIDADE</text>
    <text x="255" y="286" class="classTitle">Cliente</text>
    <line x1="255" y1="304" x2="470" y2="304" stroke="#223655"/>
    <text x="255" y="334" class="classBody">+ idCliente</text>
    <text x="255" y="360" class="classBody">+ nome</text>
    <text x="255" y="386" class="classBody">+ contato</text>
  </g>

  <g>
    <rect x="680" y="210" width="290" height="180" rx="22" fill="#101B2E" stroke="#6F8BFF" stroke-opacity="0.36"/>
    <text x="710" y="248" class="classMeta">PROCESSO CENTRAL</text>
    <text x="710" y="286" class="classTitle">OrdemServico</text>
    <line x1="710" y1="304" x2="940" y2="304" stroke="#223655"/>
    <text x="710" y="334" class="classBody">+ idOrdem</text>
    <text x="710" y="360" class="classBody">+ dataEntrada</text>
    <text x="710" y="386" class="classBody">+ status</text>
  </g>

  <g>
    <rect x="1170" y="210" width="250" height="180" rx="22" fill="#101B2E" stroke="#6CE6FF" stroke-opacity="0.36"/>
    <text x="1200" y="248" class="classMeta">ATIVO</text>
    <text x="1200" y="286" class="classTitle">Equipamento</text>
    <line x1="1200" y1="304" x2="1390" y2="304" stroke="#223655"/>
    <text x="1200" y="334" class="classBody">+ idEquipamento</text>
    <text x="1200" y="360" class="classBody">+ modelo</text>
    <text x="1200" y="386" class="classBody">+ serie</text>
  </g>

  <g>
    <rect x="705" y="472" width="240" height="170" rx="22" fill="#101B2E" stroke="#6CE6FF" stroke-opacity="0.36"/>
    <text x="735" y="510" class="classMeta">ANALISE</text>
    <text x="735" y="548" class="classTitle">Diagnostico</text>
    <line x1="735" y1="566" x2="915" y2="566" stroke="#223655"/>
    <text x="735" y="596" class="classBody">+ defeito</text>
    <text x="735" y="622" class="classBody">+ observacoes</text>
    <text x="735" y="648" class="classBody">+ prazo</text>
  </g>

  <g>
    <rect x="360" y="472" width="260" height="170" rx="22" fill="#101B2E" stroke="#6CE6FF" stroke-opacity="0.36"/>
    <text x="390" y="510" class="classMeta">RECURSO</text>
    <text x="390" y="548" class="classTitle">Tecnico</text>
    <line x1="390" y1="566" x2="590" y2="566" stroke="#223655"/>
    <text x="390" y="596" class="classBody">+ idTecnico</text>
    <text x="390" y="622" class="classBody">+ nome</text>
    <text x="390" y="648" class="classBody">+ especialidade</text>
  </g>

  <g>
    <rect x="1030" y="472" width="275" height="170" rx="22" fill="#101B2E" stroke="#6F8BFF" stroke-opacity="0.36"/>
    <text x="1060" y="510" class="classMeta">INSUMO</text>
    <text x="1060" y="548" class="classTitle">Peca</text>
    <line x1="1060" y1="566" x2="1275" y2="566" stroke="#223655"/>
    <text x="1060" y="596" class="classBody">+ idPeca</text>
    <text x="1060" y="622" class="classBody">+ descricao</text>
    <text x="1060" y="648" class="classBody">+ estoque</text>
  </g>

  <g>
    <rect x="690" y="734" width="270" height="120" rx="22" fill="#101B2E" stroke="#6CE6FF" stroke-opacity="0.36"/>
    <text x="720" y="772" class="classMeta">ACOMPANHAMENTO</text>
    <text x="720" y="810" class="classTitle">Atendimento</text>
    <line x1="720" y1="828" x2="930" y2="828" stroke="#223655"/>
    <text x="720" y="852" class="classBody">+ historico / atualizacao</text>
  </g>

  <text x="555" y="288" class="relation">1 .. *</text>
  <text x="1040" y="288" class="relation">1 .. 1</text>
  <text x="835" y="444" class="relation">gera</text>
  <text x="646" y="548" class="relation">executa</text>
  <text x="962" y="548" class="relation">utiliza</text>
  <text x="835" y="706" class="relation">atualiza</text>
</svg>
